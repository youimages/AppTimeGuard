name: Build iOS signed IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      DEVICE_UDID: ${{ secrets.DEVICE_UDID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls /Applications/ | grep Xcode
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install toolchain (xcodegen + fastlane)
        run: |
          brew install xcodegen
          brew install fastlane

      - name: Generate Xcode project (app + DeviceActivityMonitor extension)
        run: |
          cd AppTimeGuardiOS
          cat > project.yml << 'YAML'
          name: AppTimeGuard
          options:
            bundleIdPrefix: com.timewarden
            deploymentTarget:
              iOS: "16.0"
          targets:
            AppTimeGuard:
              type: application
              platform: iOS
              sources:
                - path: AppTimeGuard
                - path: Shared
              dependencies:
                - target: DeviceActivityMonitorExtension
                - sdk: FamilyControls.framework
                - sdk: ManagedSettings.framework
                - sdk: DeviceActivity.framework
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.timewarden.app
                  INFOPLIST_FILE: AppTimeGuard/Info.plist
                  CODE_SIGN_ENTITLEMENTS: AppTimeGuard/AppTimeGuard.entitlements
                  TARGETED_DEVICE_FAMILY: "1,2"
                  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
            DeviceActivityMonitorExtension:
              type: app-extension
              platform: iOS
              sources:
                - path: DeviceActivityMonitor
                - path: Shared
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.timewarden.app.deviceactivitymonitor
                  INFOPLIST_FILE: DeviceActivityMonitor/Info.plist
                  CODE_SIGN_ENTITLEMENTS: DeviceActivityMonitor/DeviceActivityMonitorExtension.entitlements
                  TARGETED_DEVICE_FAMILY: "1,2"
                  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
          YAML
          xcodegen generate

      - name: Validate project compiles (unsigned, simulator)
        run: |
          set -o pipefail
          cd AppTimeGuardiOS
          xcodebuild \
            -project AppTimeGuard.xcodeproj \
            -scheme AppTimeGuard \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-validate \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -30

      - name: Build signed IPA via fastlane
        if: ${{ env.APPLE_TEAM_ID != '' && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_CONTENT != '' }}
        run: fastlane ios build

      - name: Upload signed IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AppTimeGuard-signed-ipa
          path: AppTimeGuardiOS/build/ipa/AppTimeGuard.ipa
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ~/Library/Logs/gym/
            /Users/runner/Library/Logs/gym/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 测试版：免费账号 / 开发者模式可安装
  # 不含 DeviceActivityMonitor 扩展、不含 FamilyControls 能力，
  # 产出未签名 .app，用户用免费 Apple ID（Sideloadly / Xcode）重签即可装到手机。
  # ---------------------------------------------------------------------------
  build-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate TEST Xcode project (no extension, no FamilyControls)
        run: |
          cd AppTimeGuardiOS
          xcodegen generate --spec project-test.yml

      - name: Build test .app (unsigned)
        run: |
          set -o pipefail
          cd AppTimeGuardiOS
          xcodebuild \
            -project AppTimeGuardTest.xcodeproj \
            -scheme AppTimeGuardTest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-test \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -30

      - name: Package unsigned .app into zip for sideloading
        run: |
          cd AppTimeGuardiOS
          APP=$(find build-test -name "AppTimeGuardTest.app" -type d | head -1)
          echo "Found app: $APP"
          ditto -c -k --keepParent "$APP" AppTimeGuardTest-unsigned.zip
          ls -lh AppTimeGuardTest-unsigned.zip

      - name: Upload unsigned test .app
        uses: actions/upload-artifact@v4
        with:
          name: AppTimeGuard-test-app-unsigned
          path: AppTimeGuardiOS/AppTimeGuardTest-unsigned.zip
          if-no-files-found: warn

