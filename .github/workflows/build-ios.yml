name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (use latest installed)
        run: |
          ls /Applications/ | grep Xcode
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd AppTimeGuardiOS
          cat > project.yml << 'YAML'
          name: AppTimeGuard
          options:
            bundleIdPrefix: com.timewarden
            deploymentTarget:
              iOS: "15.0"
          settings:
            base:
              DEVELOPMENT_TEAM: ""
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGNING_ALLOWED: NO
          targets:
            AppTimeGuard:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: AppTimeGuard
                - path: Shared
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.timewarden.app
                  INFOPLIST_FILE: AppTimeGuard/Info.plist
                  CODE_SIGN_ENTITLEMENTS: AppTimeGuard/AppTimeGuard.entitlements
                  TARGETED_DEVICE_FAMILY: "1,2"
                  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
              dependencies:
                - sdk: FamilyControls.framework
                - sdk: ManagedSettings.framework
                - sdk: DeviceActivity.framework
          YAML
          xcodegen generate

      - name: Build app (no signing)
        run: |
          cd AppTimeGuardiOS
          xcodebuild \
            -project AppTimeGuard.xcodeproj \
            -scheme AppTimeGuard \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -40

      - name: Package .app into artifact
        run: |
          cd AppTimeGuardiOS
          APP_PATH=$(find build -name "AppTimeGuard.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            mkdir -p artifact
            cp -R "$APP_PATH" artifact/
            # 生成一个说明文件
            cat > artifact/README.txt << 'EOF'
          AppTimeGuard iOS Debug Build (unsigned)
          ========================================
          This is an unsigned .app compiled on GitHub Actions macOS runner.

          To install on device:
          1. Open in Xcode on your Mac
          2. Configure signing with your Apple ID
          3. Enable Family Controls capability in Signing & Capabilities
          4. Build and run on your iPhone

          Note: Family Controls requires Apple Developer account capability.
          EOF
            echo "Packaged successfully"
          else
            echo "App not found, creating error log"
            mkdir -p artifact
            xcodebuild -project AppTimeGuard.xcodeproj -scheme AppTimeGuard -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build > artifact/build-error.log 2>&1 || true
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppTimeGuard-ios-app
          path: AppTimeGuardiOS/artifact/
          if-no-files-found: warn
